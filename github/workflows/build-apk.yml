name: Construire l'APK Android
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3"
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: fermeagro-apk
          path: bin/*.apk
