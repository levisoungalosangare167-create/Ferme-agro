<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Gestion Ferme</title>
<style>
:root{--bg:#eaf0ea;--card:#fff;--ink:#1b2a20;--mute:#5a6d60;--line:#d3dfd4;--leaf:#1f6b3a;--tint:#dff0e3;--gold:#b87d00;--red:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#101812;--card:#1a251d;--ink:#e6efe8;--mute:#9db0a2;--line:#2e4033;--leaf:#4cae6a;--tint:#22382a;--gold:#e0a62a;--red:#ef6a5b}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Roboto,system-ui,sans-serif}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
header h1{font-size:20px;margin:0;flex:1}header button{border:0;background:var(--tint);color:var(--leaf);border-radius:10px;width:40px;height:40px;font-size:20px;font-weight:700}
#body{flex:1;overflow-y:auto;padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
h2{font-size:15px;margin:2px 0 0}.mute{color:var(--mute);font-size:13px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.flex{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.pos{color:var(--leaf);font-weight:700}.neg{color:var(--red);font-weight:700}
label{font-weight:600;font-size:14px;margin-top:6px;display:block}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;width:100%;box-sizing:border-box}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #2f7de1;outline-offset:1px}
.btn{border:0;border-radius:12px;background:var(--leaf);color:#fff;font:600 16px inherit;font-family:inherit;min-height:50px;padding:12px;width:100%}
.btn.alt{background:var(--tint);color:var(--leaf)}.btn.red{background:var(--red)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:9px 14px;font:inherit;min-height:40px}
.seg button.on{background:var(--leaf);color:#fff;border-color:var(--leaf);font-weight:600}
.al{border:1px solid var(--line);border-left:5px solid var(--gold);background:var(--card);border-radius:10px;padding:10px 12px}.al.r{border-left-color:var(--red)}
.pb{height:10px;background:var(--tint);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--leaf)}
.tag{font-size:12px;border-radius:8px;padding:2px 8px;background:var(--tint);color:var(--leaf);font-weight:600}.tag.g{background:#f6e6b8;color:#6b4a00}.tag.x{background:var(--line);color:var(--mute)}
.pc{text-align:left;font:inherit;color:inherit;width:100%}
.dot{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:2px solid var(--line)}
.bars div{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%}.bars i{flex:1;min-height:2px;border-radius:3px 3px 0 0}
.hb{height:14px;border-radius:5px;background:var(--leaf)}
.cal{display:grid;grid-template-columns:40px repeat(7,1fr);gap:2px;font-size:11px;text-align:center;align-items:center}
.cal button{height:32px;border:1px solid var(--line);border-radius:4px;padding:0}.cal .now{outline:2px solid var(--ink);outline-offset:-2px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);font:12px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
nav button.on{color:var(--leaf);font-weight:700}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .plus{margin-top:-18px}nav .plus span{background:var(--leaf);color:#fff;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.li span{flex:1}.li button{border:0;background:var(--red);color:#fff;border-radius:8px;width:40px;min-height:40px}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
#pop>div{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;display:none;font-weight:600}
</style></head><body>
<div id="app"><header><h1 id="ti"></h1><button id="bk" aria-label="Retour">‹</button></header><main id="body"></main><nav id="nav"></nav></div>
<div id="toast" role="status"></div><input type="file" id="fi" accept=".json" hidden>
<div id="pop" role="dialog" aria-modal="true"><div><h2 id="pt"></h2><div id="pm"></div><div class="flex" id="pb"></div></div></div>
<script>
const $=s=>document.querySelector(s),v=id=>$("#"+id).value,KEY="ferme_agro_v1";
const MOIS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const CUL=["TOMATE","OIGNON","POIVRON","CELERI","AUBERGINE","GOMBO","PIMENT"];
const PAL={b:"#1b5e20",v:"#8bc34a",a:"#f08a24",r:"#d62828",n:"#ffffff"},ORD=["b","v","a","r","n"];
const LEG=[["b","Rare sur le marché"],["v","Assez rare"],["a","Abondant"],["r","Très abondant"],["n","Pas de donnée"]];
const CAL0=["abaavbb","aaarvbb","ararbbb","arbabbb","brbabbb","babbbbb","babbbab","babbbab","bbbbbab","bbbbbab","abavvbb","abavvbb"];
const vide=()=>({n:1,parc:[],recol:[],dep:[],rec:[],act:[],caisse:[],mat:[],chg:[],cal:CAL0.map(l=>[...l])});
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!D||!D.parc)D=vide();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){popup("Attention","Impossible d'enregistrer sur ce téléphone.")}},nid=()=>D.n++;
const iso=d=>d.toISOString().slice(0,10),TD=iso(new Date()),off=n=>iso(new Date(Date.now()+n*864e5));
const days=s=>Math.round((new Date(s)-new Date(TD))/864e5);
const money=x=>Math.round(x).toLocaleString("fr-FR"),fr=i=>i?i.split("-").reverse().join("/"):"",sum=(a,f)=>a.reduce((s,r)=>s+f(r),0);
const bad=m=>{throw new Error(m)},info=c=>D.parc.find(p=>p.code==c)||{},recM=r=>r.q*r.p;
function pdate(s){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((s||"").trim());if(!m)bad("Date invalide : écrivez JJ/MM/AAAA");const d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getMonth()!=m[2]-1)bad("Cette date n'existe pas : "+s);return`${m[3]}-${m[2]}-${m[1]}`}
function pnum(s,l,int){s=(s||"").replace(",",".").trim();if(!s)bad(l+" : champ obligatoire");const x=+s;if(isNaN(x))bad(l+" : nombre invalide");if(x<=0)bad(l+" doit être supérieur à 0");if(int&&x!=Math.floor(x))bad(l+" doit être entier");return x}
const req=(s,l)=>{s=(s||"").trim();if(!s)bad(l+" : champ obligatoire");return s};
function pyear(s){let d=(s||"").replace(/\D/g,"");if(d.length==4)d=d.slice(2);if(d.length!=2)bad("Année : 2 chiffres (ex. 26)");return+d}
function popup(t,m,btns){$("#pt").textContent=t;$("#pm").innerHTML=m;const b=$("#pb");b.innerHTML="";(btns||[["OK",null,""]]).forEach(([n,f,c])=>{const e=document.createElement("button");e.className="btn "+c;e.textContent=n;e.onclick=()=>{$("#pop").style.display="none";f&&f()};b.append(e)});$("#pop").style.display="flex"}
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)};
const tryDo=f=>{try{f()}catch(e){popup("À corriger",`<span class="neg">${e.message}</span>`)}};
const mask=el=>{const d=el.value.replace(/\D/g,"").slice(0,8);el.value=d.slice(0,2)+(d.length>2?"/"+d.slice(2,4):"")+(d.length>4?"/"+d.slice(4):"")};
const fl=(l,h)=>`<label>${l}</label>${h}`;
const dIn=(id,x="")=>`<input id="${id}" inputmode="numeric" placeholder="JJ/MM/AAAA" value="${x}" oninput="mask(this)">`;
const nIn=(id,ph="")=>`<input id="${id}" inputmode="decimal" placeholder="${ph}" oninput="this.value=this.value.replace(',','.').replace(/[^0-9.]/g,'').replace(/(\\..*)\\./,'$1')">`;
const iIn=(id,ph="",x="")=>`<input id="${id}" inputmode="numeric" placeholder="${ph}" value="${x}" oninput="this.value=this.value.replace(/\\D/g,'')">`;
const tIn=(id,ph="")=>`<input id="${id}" placeholder="${ph}">`;
const sel=(id,vals,ph,c)=>`<select id="${id}"><option value="">${ph}</option>${vals.map(x=>`<option${x==c?" selected":""}>${x}</option>`).join("")}</select>`;
const grp=(a,k,f)=>{const o={};a.forEach(r=>o[k(r)]=(o[k(r)]||0)+f(r));return o};
const stats=p=>{const R=sum(D.rec.filter(r=>r.code==p.code),recM),P=sum(D.dep.filter(r=>r.code==p.code),r=>r.m),S=sum(D.recol.filter(r=>r.code==p.code),r=>r.n);return{R,P,S,marge:R-P,rend:S/(p.sup/100),cout:P/p.sup}};
function statut(p){if(p.fin&&days(p.fin)<0)return["Terminée","x"];if(p.rec&&days(p.rec)<=0)return["En récolte","g"];if(days(p.semis)<=0)return["En croissance",""];return["À semer",""]}
const prog=p=>{const a=days(p.semis),b=p.rec?days(p.rec):a+90;return Math.max(0,Math.min(100,(0-a)/Math.max(1,b-a)*100))};
const caisseT=()=>{const e=sum(D.caisse,r=>r.e),s=sum(D.caisse,r=>r.s);return[e,s,e-s]};
const usedC=()=>[...new Set(D.parc.map(p=>p.cult))];
function conseils(){const m0=new Date().getMonth(),out=[];CUL.forEach((c,j)=>{const ps=D.parc.filter(p=>p.cult==c&&p.rec);if(!ps.length)return;const cy=sum(ps,p=>days(p.rec)-days(p.semis))/ps.length;
 for(let k=0;k<=12;k++){const mi=(m0+k)%12;if(D.cal[mi][j]!="b")continue;const st=new Date(new Date().getFullYear(),m0+k,1),lim=Math.floor((st-new Date())/864e5-cy);if(lim>=0){out.push(`<b>${c}</b> : semez avant le ${fr(off(lim))} pour récolter en ${MOIS[mi].toLowerCase()}, quand il est rare sur le marché.`);break}}});return out}
const T={home:"Gestion Ferme",parcelles:"Parcelles",pform:"Nouvelle culture",pdet:"Détail parcelle",saisie:"Saisir une donnée",caisse:"Caisse",plus:"Plus",analyse:"Analyse",calendrier:"Calendrier du marché",charges:"Charges annuelles",donnees:"Données"};
const PAR={pform:"parcelles",pdet:"parcelles",analyse:"plus",calendrier:"plus",charges:"plus",donnees:"plus"};
const NAV=[["home","Accueil","M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"],["parcelles","Parcelles","M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"],["saisie","",""],["caisse","Caisse","M3 7h18v12H3zM3 11h18M16 15h2"],["plus","Plus","M5 12h.01M12 12h.01M19 12h.01"]];
$("#nav").innerHTML=NAV.map(([k,l,d])=>k=="saisie"?`<button class="plus" onclick="go('saisie')" aria-label="Saisir"><span>+</span></button>`:`<button data-k="${k}" onclick="go('${k}')"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${l}</button>`).join("");
let cur="home",arg,tab="Récolte",pick="",sens=1,inst;
function go(n,a){cur=n;arg=a;$("#ti").textContent=T[n];$("#bk").style.visibility=["home","parcelles","caisse","plus"].includes(n)?"hidden":"visible";
 document.querySelectorAll("nav [data-k]").forEach(b=>b.classList.toggle("on",b.dataset.k==(PAR[n]||n)));$("#body").innerHTML=V[n]();R[n]&&R[n]();$("#body").scrollTop=0}
$("#bk").onclick=()=>go(PAR[cur]||"home");
const bar=p=>`<div class="pb"><i style="width:${prog(p)}%"></i></div>`;
const pcard=p=>{const[s,c]=statut(p),x=stats(p);return`<button class="card pc" onclick="go('pdet','${p.code}')"><div class="flex sp"><b>${p.cult} · ${p.code}</b><span class="tag ${c}">${s}</span></div>${bar(p)}<div class="flex sp mute"><span>${p.sup} m² · semis ${fr(p.semis)}</span><span class="${x.marge>=0?"pos":"neg"}">Marge ${money(x.marge)}</span></div></button>`};
const V={
home:()=>{const[e,s,so]=caisseT(),al=[];D.parc.forEach(p=>{if(p.rec){const d=days(p.rec);if(d>=0&&d<=7)al.push(["",`Récolte de ${p.cult} (${p.code}) ${d?"dans "+d+" jours":"aujourd'hui"}.`])}
 if(statut(p)[0]=="En récolte"&&!D.recol.some(r=>r.code==p.code))al.push(["r",`${p.code} est en récolte : aucun sac enregistré.`])});if(so<0)al.push(["r","La caisse est négative."]);
 const m=new Date().getMonth();
 return`<div class="card"><span class="mute">Solde de la caisse</span><div class="big ${so>=0?"":"neg"}">${money(so)}</div><div class="flex sp mute"><span>Entrées +${money(e)}</span><span>Sorties −${money(s)}</span></div></div>`+
 (D.parc.length?"":`<div class="card"><h2>Bienvenue</h2><span>Commencez par ajouter votre première culture : l'application suivra ensuite vos récoltes, dépenses et recettes.</span><button class="btn" onclick="go('pform')">Ajouter ma première culture</button></div>`)+
 al.map(([c,t])=>`<div class="al ${c}">${t}</div>`).join("")+
 `<div class="card"><h2>Le marché en ${MOIS[m].toLowerCase()}</h2><div class="flex" style="flex-wrap:wrap">${CUL.map((c,j)=>`<span class="flex" style="width:48%"><i class="dot" style="background:${PAL[D.cal[m][j]]}"></i>${c}</span>`).join("")}</div><span class="mute">Vert foncé : rare, donc bien payé. Rouge : abondant.</span>${conseils().slice(0,2).map(t=>`<div>${t}</div>`).join("")}</div>`+
 (D.parc.length?`<h2>Parcelles en cours</h2>${D.parc.filter(p=>statut(p)[0]!="Terminée").map(pcard).join("")}<button class="btn alt" onclick="go('analyse')">Voir l'analyse</button>`:"")},
parcelles:()=>`<button class="btn" onclick="go('pform')">+ Nouvelle culture</button>${D.parc.map(pcard).join("")||"Aucune parcelle pour l'instant."}`,
pdet:()=>{const p=info(arg),x=stats(p),[s,c]=statut(p);return`<div class="card"><div class="flex sp"><b style="font-size:20px">${p.cult}</b><span class="tag ${c}">${s}</span></div><span class="mute">Code ${p.code} · ${p.sup} m² · cycle ${p.cycle}</span>${bar(p)}<span class="mute">Semis ${fr(p.semis)} · récolte prévue ${fr(p.rec)||"—"}</span></div>
<div class="card"><div class="flex sp"><span>Recettes</span><b>${money(x.R)}</b></div><div class="flex sp"><span>Dépenses</span><b>${money(x.P)}</b></div><div class="flex sp"><span>Marge</span><b class="${x.marge>=0?"pos":"neg"}">${money(x.marge)}</b></div></div>
<div class="card"><div class="flex sp"><span>Sacs récoltés</span><b>${x.S}</b></div><div class="flex sp"><span>Rendement</span><b>${x.rend.toFixed(1)} sacs / 100 m²</b></div><div class="flex sp"><span>Coût</span><b>${money(x.cout)} / m²</b></div></div><button class="btn" onclick="pick='${p.code}';go('saisie')">Saisir pour cette parcelle</button>`},
pform:()=>fl("Numéro de la parcelle *",tIn("pn","ex. P1"))+fl("Superficie (m²) *",nIn("ps"))+fl("Culture *",sel("pc",[...new Set([...usedC(),...CUL])],"Choisir"))+tIn("pl","ou écrire une nouvelle culture")+fl("Date de semis *",dIn("pd"))+fl("Date de récolte prévue",dIn("pr"))+fl("Date de fin des récoltes",dIn("pf"))+`<div class="flex"><div>${fl("Cycle *",iIn("py","1"))}</div><div>${fl("Année *",iIn("pa","",String(new Date().getFullYear()).slice(2)))}</div></div><div class="pos" id="pk"></div><button class="btn" onclick="saveP()">Enregistrer la parcelle</button>`,
saisie:()=>`<div class="seg">${["Récolte","Dépense","Recette","Activité culturale"].map(t=>`<button class="${t==tab?"on":""}" onclick="tab='${t}';go('saisie')">${t}</button>`).join("")}</div>`+fl("Parcelle *","")+(D.parc.length?`<div class="seg">${D.parc.map(p=>`<button class="${p.code==pick?"on":""}" onclick="pick='${p.code}';go('saisie')">${p.code} · ${p.cult}</button>`).join("")}</div>`:`<div>Créez d'abord une culture.</div><button class="btn alt" onclick="go('pform')">+ Nouvelle culture</button>`)+fl("Date *",dIn("sd",fr(TD)))+({"Récolte":fl("Nombre de sacs *",nIn("s1")),"Dépense":fl("Catégorie *",tIn("s1","ex. Engrais"))+fl("Montant *",nIn("s2")),"Recette":fl("Produit vendu *",tIn("s1"))+fl("Quantité *",nIn("s2"))+fl("Prix unitaire *",nIn("s3"))+`<div class="pos" id="st">Montant total : 0</div>`,"Activité culturale":fl("Type d'activité *",tIn("s1","ex. Désherbage"))+fl("Intrant utilisé",tIn("s2"))}[tab])+(["Dépense","Recette"].includes(tab)?`<label class="flex"><input type="checkbox" id="sc" checked style="width:22px;min-height:22px"> Enregistrer aussi dans la caisse</label>`:"")+`<button class="btn" onclick="saveS()">Enregistrer</button>`,
caisse:()=>{const[e,s,so]=caisseT();return`<div class="card"><span class="mute">Solde</span><div class="big">${money(so)}</div><span class="mute">Entrées ${money(e)} · Sorties ${money(s)}</span></div><div class="seg"><button id="te" class="${sens?"on":""}" onclick="setS(1)">Entrée</button><button id="ts" class="${sens?"":"on"}" onclick="setS(0)">Sortie</button></div>${fl("Date *",dIn("cd",fr(TD)))}${fl("Motif *",tIn("cm","ex. Achat de semences"))}${fl("Montant *",nIn("cn"))}<button class="btn" onclick="saveC()">Enregistrer</button><h2>Dernières opérations</h2>${[...D.caisse].reverse().slice(0,20).map(r=>`<div class="li"><span>${fr(r.d)} · ${r.motif}</span><b class="${r.e?"pos":"neg"}">${r.e?"+"+money(r.e):"−"+money(r.s)}</b></div>`).join("")}`},
plus:()=>[["analyse","Analyse recettes et dépenses"],["calendrier","Calendrier du marché"],["charges","Charges annuelles"],["donnees","Données, sauvegarde, export"]].map(([k,t])=>`<button class="btn alt" onclick="go('${k}')">${t}</button>`).join("")+`<div class="card"><h2>Installer l'application</h2><span class="mute">Menu ⋮ du navigateur → « Installer l'application » ou « Ajouter à l'écran d'accueil ».</span>${inst?`<button class="btn" onclick="inst.prompt()">Installer maintenant</button>`:""}</div>`,
analyse:()=>{const y=new Date().getFullYear(),mo=Array(12).fill(0).map(()=>[0,0]);D.rec.filter(r=>r.d.startsWith(y)).forEach(r=>mo[+r.d.slice(5,7)-1][0]+=recM(r));D.dep.filter(r=>r.d.startsWith(y)).forEach(r=>mo[+r.d.slice(5,7)-1][1]+=r.m);const mx=Math.max(1,...mo.flat());
 const Rr=sum(D.rec,recM),P=sum(D.dep,r=>r.m),am=sum(D.mat,m=>m.m/m.dur)+sum(D.chg,c=>c.m),res=Rr-P-am;
 const byC=grp(D.parc,p=>p.cult,p=>stats(p).marge),mm=Math.max(1,...Object.values(byC).map(Math.abs));
 return`<div class="card"><h2>Résultat (recettes − dépenses − charges annuelles)</h2><div class="big ${res>=0?"pos":"neg"}">${money(res)}</div><span class="mute">Recettes ${money(Rr)} · dépenses ${money(P)} · charges ${money(am)}</span></div>
<div class="card"><h2>Mois par mois (${y})</h2><div class="bars">${mo.map(([r,d],i)=>`<div title="${MOIS[i]}"><i style="background:var(--leaf);height:${r/mx*100}%"></i><i style="background:var(--red);height:${d/mx*100}%"></i></div>`).join("")}</div><div class="flex sp mute"><span>Jan</span><span><span class="pos">■</span> recettes <span class="neg">■</span> dépenses</span><span>Déc</span></div></div>
<div class="card"><h2>Marge par culture</h2>${Object.entries(byC).map(([c,m])=>`<div class="flex sp"><span>${c}</span><b class="${m>=0?"pos":"neg"}">${money(m)}</b></div><div class="hb" style="width:${Math.abs(m)/mm*100}%;background:${m>=0?"var(--leaf)":"var(--red)"}"></div>`).join("")||"<span class='mute'>Aucune donnée pour l'instant.</span>"}</div>
<div class="card"><h2>Classement des parcelles</h2>${[...D.parc].sort((a,b)=>stats(b).marge-stats(a).marge).map(p=>`<div class="flex sp"><span>${p.code} ${p.cult}</span><span class="mute">${stats(p).rend.toFixed(1)} sacs/100 m²</span><b class="${stats(p).marge>=0?"pos":"neg"}">${money(stats(p).marge)}</b></div>`).join("")}</div>`},
calendrier:()=>{const m=new Date().getMonth(),cs=conseils();return`<div class="card"><h2>Quand le produit est-il rare ?</h2>${LEG.map(([k,t])=>`<div class="flex"><i class="dot" style="background:${PAL[k]}"></i>${t}</div>`).join("")}<span class="mute">Touchez une case pour la modifier. Le mois en cours est encadré.</span></div><div class="cal"><span></span>${CUL.map(c=>`<b>${c.slice(0,4)}</b>`).join("")}${MOIS.map((n,i)=>`<span>${n.slice(0,4)}</span>`+D.cal[i].map((k,j)=>`<button class="${i==m?"now":""}" aria-label="${n} ${CUL[j]}" style="background:${PAL[k]}" onclick="cyc(this,${i},${j})"></button>`).join("")).join("")}</div><div class="card"><h2>Conseils de semis</h2><span class="mute">Calculés avec la durée de vos cycles (semis → récolte).</span>${cs.map(t=>`<div>${t}</div>`).join("")||"Enregistrez une parcelle avec dates de semis et de récolte."}</div>`},
charges:()=>`<h2>Matériel (amortissement = montant ÷ durée)</h2>${fl("Matériel",tIn("mn"))}${fl("Montant",nIn("mm"))}${fl("Durée (années)",nIn("md"))}<button class="btn" onclick="addM()">Ajouter le matériel</button>${fl("Autre charge annuelle",tIn("xn","ex. Assurance"))}${fl("Montant",nIn("xm"))}<button class="btn alt" onclick="addX()">Ajouter la charge</button><div class="card">${D.mat.map(m=>`<div class="flex sp"><span>${m.nom}</span><span>${money(m.m/m.dur)}/an</span></div>`).join("")}${D.chg.map(c=>`<div class="flex sp"><span>${c.nom}</span><span>${money(c.m)}/an</span></div>`).join("")}<b>Total : ${money(sum(D.mat,m=>m.m/m.dur)+sum(D.chg,c=>c.m))} / an</b></div>`,
donnees:()=>`<button class="btn" onclick="backup()">Sauvegarder (fichier .json)</button><button class="btn alt" onclick="$('#fi').click()">Restaurer une sauvegarde</button><button class="btn alt" onclick="exCsv()">Exporter pour Excel (.csv)</button><button class="btn red" onclick="razAll()">Remettre l'application à zéro</button>`+fl("Historique — choisir une table",sel("dt",Object.keys(HIST),"Table"))+`<div id="dl"></div>`};
const R={pform:()=>{["pn","py","pa"].forEach(i=>$("#"+i).addEventListener("input",()=>{try{$("#pk").textContent="Code de suivi : "+pyear(v("pa"))+"-"+v("pn").trim()+v("py").trim()}catch(e){$("#pk").textContent=""}}))},
saisie:()=>{if(tab=="Recette")["s2","s3"].forEach(i=>$("#"+i).addEventListener("input",()=>$("#st").textContent="Montant total : "+money((+v("s2")||0)*(+v("s3")||0))))},
donnees:()=>$("#dt").onchange=hist};
function saveP(){tryDo(()=>{const num=req(v("pn"),"Numéro"),sup=pnum(v("ps"),"Superficie"),cu=req(v("pl")||v("pc"),"Culture").toUpperCase(),cy=pnum(v("py"),"Cycle",1),an=pyear(v("pa")),se=pdate(v("pd")),re=v("pr").trim()?pdate(v("pr")):null,fi=v("pf").trim()?pdate(v("pf")):null;
 if(re&&re<se)bad("La date de récolte prévue est avant le semis");if(fi&&fi<(re||se))bad("La date de fin des récoltes est trop tôt");const code=`${an}-${num}${cy}`;if(D.parc.some(p=>p.code==code))bad("Le code "+code+" existe déjà");
 D.parc.push({id:nid(),numero:num,sup,cult:cu,semis:se,rec:re,fin:fi,cycle:cy,an,code});save();toast("Parcelle "+code+" enregistrée");go("parcelles")})}
function saveS(){tryDo(()=>{if(!pick)bad("Choisissez la parcelle.");const d=pdate(v("sd")),x=v("s1"),c=pick,k=$("#sc")&&$("#sc").checked;
 if(tab=="Récolte")D.recol.push({id:nid(),d,code:c,n:pnum(x,"Nombre de sacs")});
 else if(tab=="Dépense"){const m=pnum(v("s2"),"Montant"),cat=req(x,"Catégorie"),i=nid();D.dep.push({id:i,d,code:c,cat,m});k&&D.caisse.push({id:nid(),d,motif:cat+" ("+c+")",e:0,s:m,src:"dep",ref:i})}
 else if(tab=="Recette"){const pr=req(x,"Produit"),q=pnum(v("s2"),"Quantité"),p=pnum(v("s3"),"Prix unitaire"),i=nid();D.rec.push({id:i,d,code:c,prod:pr,q,p});k&&D.caisse.push({id:nid(),d,motif:"Vente "+pr+" ("+c+")",e:q*p,s:0,src:"rec",ref:i})}
 else D.act.push({id:nid(),d,code:c,t:req(x,"Type d'activité"),i:v("s2")});save();toast("Enregistré avec succès");go("saisie")})}
function setS(e){sens=e;go("caisse")}
function saveC(){tryDo(()=>{const d=pdate(v("cd")),m=req(v("cm"),"Motif"),n=pnum(v("cn"),"Montant");D.caisse.push({id:nid(),d,motif:m,e:sens?n:0,s:sens?0:n});save();toast("Enregistré avec succès");go("caisse")})}
function addM(){tryDo(()=>{D.mat.push({id:nid(),nom:req(v("mn"),"Matériel"),m:pnum(v("mm"),"Montant"),dur:pnum(v("md"),"Durée")});save();go("charges")})}
function addX(){tryDo(()=>{D.chg.push({id:nid(),nom:req(v("xn"),"Charge"),m:pnum(v("xm"),"Montant")});save();go("charges")})}
function cyc(b,i,j){D.cal[i][j]=ORD[(ORD.indexOf(D.cal[i][j])+1)%5];b.style.background=PAL[D.cal[i][j]];save()}
const HIST={Parcelles:["parc",p=>`${p.code} · ${p.cult} · ${p.sup} m² · semis ${fr(p.semis)}`],Activités:["act",a=>`${fr(a.d)} · ${a.code} · ${a.t} ${a.i||""}`],Récoltes:["recol",r=>`${fr(r.d)} · ${r.code} · ${r.n} sacs`],Dépenses:["dep",r=>`${fr(r.d)} · ${r.code} · ${r.cat} · ${money(r.m)}`],Recettes:["rec",r=>`${fr(r.d)} · ${r.code} · ${r.prod} · ${r.q} × ${money(r.p)} = ${money(recM(r))}`],Caisse:["caisse",r=>`${fr(r.d)} · ${r.motif} · ${r.e?"Entrée +"+money(r.e):"Sortie -"+money(r.s)}`],Matériel:["mat",m=>`${m.nom} · ${money(m.m)} sur ${m.dur} an(s)`],"Autres charges":["chg",c=>`${c.nom} · ${money(c.m)}`]};
function hist(){const h=HIST[v("dt")],z=$("#dl");if(!h){z.innerHTML="";return}const a=D[h[0]];z.innerHTML=a.length?[...a.keys()].reverse().map(i=>`<div class="li"><span>${h[1](a[i])}</span><button aria-label="Supprimer" onclick="del('${h[0]}',${i})">X</button></div>`).join(""):"Aucune ligne."}
function del(k,i){const row=D[k][i];if(k=="parc"&&[...D.recol,...D.dep,...D.rec,...D.act].some(r=>r.code==row.code)){popup("À corriger",`<span class="neg">Suppression impossible : des saisies utilisent ${row.code}</span>`);return}
 popup("Confirmation","Supprimer cette ligne ?",[["Annuler",null,"alt"],["Supprimer",()=>{D[k].splice(i,1);if(k=="dep"||k=="rec")D.caisse=D.caisse.filter(c=>!(c.src==k&&c.ref==row.id));save();hist()},"red"]])}
function dl(nom,txt,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+txt],{type}));a.download=nom;a.click()}
function backup(){dl("ferme_sauvegarde_"+TD+".json",JSON.stringify(D),"application/json");toast("Sauvegarde créée")}
function exCsv(){const o=[];for(const[n,[k]]of Object.entries(HIST)){o.push(n);const a=D[k];if(a.length){const c=Object.keys(a[0]).filter(x=>!["id","src","ref"].includes(x));o.push(c.join(";"));a.forEach(r=>o.push(c.map(x=>String(r[x]??"").replace(/;/g,",")).join(";")))}o.push("")}dl("ferme_export_"+TD+".csv",o.join("\n"),"text/csv");toast("Export créé")}
$("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.parc||!x.caisse)throw 0;popup("Restaurer","Remplacer toutes les données actuelles par cette sauvegarde ?",[["Annuler",null,"alt"],["Restaurer",()=>{D=x;save();toast("Sauvegarde restaurée");go("home")},""]])}catch(_){popup("À corriger","<span class='neg'>Ce fichier n'est pas une sauvegarde valide.</span>")}};r.readAsText(f);e.target.value=""};
function razAll(){popup("Tout effacer ?","Toutes les données seront supprimées. Pensez à sauvegarder avant.",[["Annuler",null,"alt"],["Tout effacer",()=>{D=vide();save();toast("Application remise à zéro");go("home")},"red"]])}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();inst=e;if(cur=="plus")go("plus")});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
go("home");
</script></body></html>
