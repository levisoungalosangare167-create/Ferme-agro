};

/* --- agent --- */
const sysPrompt=()=>`Tu es ${CF.nom||"l'agent"}, l'agent de gestion d'une ferme maraîchère au Mali (monnaie : FCFA). Deux rôles : (1) saisir ce que l'utilisateur te dicte, (2) être son conseiller pour rendre la ferme rentable : analyser, vérifier la cohérence, alerter.
Aujourd'hui : ${TD}. Les dates des outils sont en AAAA-MM-JJ (« hier », « lundi dernier » : calcule-les ; sans date = aujourd'hui).
Parcelles : ${D.parc.map(p=>p.code+" "+p.cult+" "+p.sup+"m² "+statut(p)[0]).join(" ; ")||"aucune"}. Caisse : ${money(caisseT()[2])}.
Règles :
- Si tu as assez d'informations, enregistre tout de suite avec les outils (plusieurs appels possibles). S'il manque la parcelle, un montant ou une quantité, pose UNE question courte. N'invente jamais un chiffre.
- Après une saisie, confirme en une phrase. Si une valeur paraît anormale (prix, quantité, date), dis-le et lance analyser_coherence.
- Pour tout chiffre demandé, appelle un outil, ne calcule jamais de tête. Montants en FCFA, arrondis.
- Avant de supprimer quelque chose, demande confirmation.
- Rentabilité : appelle analyser_rentabilite et analyser_coherence, repère ce qui rapporte et ce qui coûte (marge, coût par sac, poste dominant, seuil de rentabilité, vendre quand le produit est rare), puis propose 2 ou 3 actions concrètes. Dis quand les données sont insuffisantes. Ne présente pas un conseil agronomique incertain comme un fait.
- Tu parles à l'oral, comme dans une vraie conversation avec un collègue de la ferme : phrases courtes et naturelles, ton chaleureux, jamais de liste ni de titre, pas de « voici », va droit au but. Écris « francs CFA » au lieu de FCFA et n'utilise aucun symbole.${CF.role?"\nConsignes personnelles de l'utilisateur (à suivre, sauf si elles t'obligent à inventer des chiffres ou à cacher un problème) :\n"+CF.role:""}`;
const cleanM=(pv,ms)=>ms.map(m=>m.role=="assistant"?{role:"assistant",content:m.content||"",...(m.tool_calls?{tool_calls:m.tool_calls.map(c=>pv=="Gemini"?c:{id:c.id,type:"function",function:c.function})}:{})}:m);
async function call1(pv,msgs){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),45000);let r,t;try{const b={model:(CF.models[pv]||PROV[pv][1]).trim().replace(/[.,;\s]+$/,""),messages:cleanM(pv,msgs),tools:TOOLS,tool_choice:"auto",temperature:.3};if(pv=="Gemini")b.reasoning_effort="low";r=await fetch(PROV[pv][0],{method:"POST",signal:ac.signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+CF.keys[pv]},body:JSON.stringify(b)});t=await r.text()}catch(e){throw new Error(e.name=="AbortError"?"Pas de réponse après 45 secondes : connexion trop lente ou bloquée. Réessayez.":"Connexion impossible ("+e.message+"). Vérifiez Internet.")}finally{clearTimeout(to)}let j;try{j=JSON.parse(t)}catch(e){}
 if(!r.ok)throw new Error((r.status==429?"Limite gratuite atteinte, réessayez dans une minute. ":r.status==401||r.status==403?"Clé API refusée. ":"Erreur "+r.status+". ")+t.slice(0,180));return j.choices[0].message}
async function llm(msgs){const ord=[CF.prov,CF.prov=="Groq"?"Gemini":"Groq"].filter(x=>CF.keys[x]),er=[];for(const pv of ord){try{const m=await call1(pv,msgs);if(er.length)toast("Bascule sur "+pv);return m}catch(e){er.push(pv+" : "+e.message)}}throw new Error(er.join(" | "))}
async function send(txt){txt=(txt||"").trim();if(!txt||busy)return;if(!hasKey()){cfgShow(1);return toast("Ajoutez d'abord une clé API")}
 window.speechSynthesis&&speechSynthesis.cancel();addMsg("user",txt);busy=1;setMode("think");paint();const snap=JSON.stringify(D);
 const msgs=[{role:"system",content:sysPrompt()},...LOG.filter(m=>m.role=="user"||m.role=="assistant").slice(-14).map(m=>({role:m.role,content:m.text}))];
 try{for(let i=0;i<7;i++){const m=await llm(msgs),tc=m.tool_calls||[];
   if(!tc.length){busy=0;addMsg("assistant",m.content||"…");speak(m.content);break}
   const ids=tc.map((c,k)=>c.id||"c"+i+k);msgs.push({...m,content:m.content||"",tool_calls:tc.map((c,k)=>({...c,id:ids[k]}))});
   tc.forEach((c,k)=>{let out;try{const f=EX[c.function.name];if(!f)bad("Outil inconnu");out=f(JSON.parse(c.function.arguments||"{}"));if(out&&out.resume){save();chip(out.resume)}}catch(e){out={erreur:e.message}}msgs.push({role:"tool",tool_call_id:ids[k],content:JSON.stringify(out)})});
   if(i==6){busy=0;setMode("idle");addMsg("assistant","Je n'ai pas réussi à terminer. Reformulez ou découpez la demande.")}}}
 catch(e){busy=0;setMode("err","⚠ "+e.message.slice(0,150));addMsg("assistant","⚠ "+e.message)}
 busy=0;if(JSON.stringify(D)!=snap)undo=snap;paint()}
function unDo(){if(!undo)return;D=JSON.parse(undo);undo=null;save();chip("Dernière saisie annulée")}
const spoken=t=>strip(t).replace(/FCFA/g,"francs CFA").replace(/(\d)\s?%/g,"$1 pour cent").replace(/\s[—–-]\s/g,", ");
const voiceOpts=()=>`<option value="">Automatique</option>`+(window.speechSynthesis?speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang)).map(x=>`<option value="${esc(x.voiceURI)}"${x.voiceURI==CF.voice?" selected":""}>${esc(x.name)} · ${esc(x.lang)}</option>`).join(""):"");
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{const e=$("#gvx");if(e)e.innerHTML=voiceOpts()};
function speak(t){if(!CF.voix||!window.speechSynthesis){setMode("idle");return listenAfter()}
 const parts=spoken(t).split(/(?<=[.!?…:;])\s+/).filter(x=>x.trim()),vs=speechSynthesis.getVoices(),vf=vs.find(x=>x.voiceURI==CF.voice)||vs.find(x=>/^fr/i.test(x.lang));
 if(!parts.length){setMode("idle");return listenAfter()}
 const fin=()=>{if(mode=="speak")setMode("idle");listenAfter()};
 parts.forEach((q,i)=>{const u=new SpeechSynthesisUtterance(q);u.lang="fr-FR";u.rate=+CF.vit||1.25;u.pitch=+CF.haut||1;if(vf)u.voice=vf;if(i==0)u.onstart=()=>setMode("speak");if(i==parts.length-1){u.onend=fin;u.onerror=fin}speechSynthesis.speak(u)})}
function testVoix(){if(!window.speechSynthesis)return toast("Voix non prise en charge");speechSynthesis.cancel();const bk={voix:CF.voix,voice:CF.voice,haut:CF.haut,vit:CF.vit,mains:CF.mains};Object.assign(CF,{voix:1,voice:v("gvx"),haut:+v("gh2")||1,vit:+v("gs")||1.25,mains:0});speak("Bonjour, je suis "+(v("gn").trim()||"votre agent")+". Voilà ma voix. Dites-moi ce que vous voulez faire.");Object.assign(CF,bk)}
const listenAfter=()=>{if(CF.mains&&cur=="agent"&&!busy&&!reco)mic()};
const mb=o=>{const b=$("#mc");b&&b.classList.toggle("rec",!!o)};
function mic(){if(!SR)return toast("Micro non pris en charge : utilisez Chrome");if(reco){reco.stop();return}window.speechSynthesis&&speechSynthesis.cancel();const r=reco=new SR();r.lang="fr-FR";r.interimResults=true;let fin="";
 r.onresult=e=>{let t="";for(const x of e.results)t+=x[0].transcript;fin=t;const i=$("#ci");if(i)i.value=t};
 r.onerror=e=>toast(e.error=="not-allowed"?"Autorisez le micro":e.error=="network"?"Internet requis pour la voix":e.error=="no-speech"?"Je n'ai rien entendu":"Micro : "+e.error);
 r.onend=()=>{reco=null;mb(0);const t=fin.trim();if(!t&&mode=="listen")setMode("idle");if(t){const i=$("#ci");if(i)i.value="";send(t)}};mb(1);setMode("listen");r.start()}
function addMsg(role,text){LOG.push({role,text});try{localStorage.setItem(AL,JSON.stringify(LOG.slice(-60)))}catch(e){}paint()}
const chip=t=>{addMsg("chip",t);if(cur=="agent")toast(t)};
const bub=m=>m.role=="chip"?`<div class="mute" style="text-align:center">✓ ${esc(m.text)}</div>`:`<div class="msg ${m.role}">${esc(m.text).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")}</div>`;
function paint(){if(cur!="agent")return;const c=$("#chat");if(!c)return;c.innerHTML=(LOG.length?"":`<div class="card"><h2>Bonjour</h2><span>Dites par exemple : « Aujourd'hui j'ai récolté 12 sacs de tomate sur P1 » ou « Combien j'ai dépensé en engrais ce mois ? ».</span></div>`)+LOG.map(bub).join("")+(busy?`<div class="msg assistant mute">Je réfléchis…</div>`:"");c.scrollTop=c.scrollHeight;const u=$("#un");if(u)u.style.display=undo?"":"none";const i=$("#ci");if(i)i.disabled=!!busy}
function sendIn(){const i=$("#ci"),t=i.value;i.value="";send(t)}
function cfgShow(f){const c=$("#cfg");if(c)c.classList.toggle("open",f?true:undefined)}
function cfgProv(p){$("#gu").value=PROV[p][0];$("#gm").value=PROV[p][1]}
function cfgSave(){CF={prov:v("gp"),keys:{Groq:v("gkg").trim(),Gemini:v("gkm").trim()},models:{Groq:v("gmg").trim(),Gemini:v("gmm").trim()},voix:$("#gv").checked?1:0,mains:$("#gh").checked?1:0,nom:v("gn").trim()||"Agri",role:v("gr").trim(),vit:+v("gs")||1.25,voice:v("gvx"),haut:+v("gh2")||1};try{localStorage.setItem(AK,JSON.stringify(CF))}catch(e){}toast("Réglages enregistrés");go("agent")}
function clrChat(){LOG=[];try{localStorage.removeItem(AL)}catch(e){}paint()}
let mode="idle",msgS="";
function setMode(m,t){mode=m;msgS=t||"";ui()}
function ui(){if(cur!="agent")return;const o=$("#orb"),t=$("#st");if(o)o.className="orb "+mode;if(t){t.textContent=msgS||({idle:"Touchez la boule pour parler",listen:"Je vous écoute…",think:"Je réfléchis…",speak:"Je parle… touchez pour m'arrêter"})[mode];t.className=mode=="err"?"neg":"mute"}}
function orbTap(){if(mode=="speak"){window.speechSynthesis&&speechSynthesis.cancel();setMode("idle");return}if(busy)return;mic()}
function chatShow(f){const c=$("#cv");c&&c.classList.toggle("open",f)}
V.agent=()=>`<div class="ag"><div class="ag-top"><button class="ic" onclick="cfgShow(1)" aria-label="Réglages">⚙</button></div><div class="ag-mid"><button id="orb" class="orb idle" onclick="orbTap()" aria-label="Parler à l'agent"></button><div class="big" style="font-size:28px">${esc(CF.nom||"Agri")}</div><div id="st" class="mute" style="min-height:40px;padding:0 12px"></div></div><div class="ag-bot"><button id="un" class="btn alt" style="display:none" onclick="unDo()">↶ Annuler la dernière saisie</button><button class="btn alt" onclick="chatShow(true)">Conversation écrite</button><div class="flex"><button class="btn alt" onclick="go('saisie')">Saisie manuelle</button><button class="btn alt" onclick="go('home')">Mes données</button></div></div>
<div id="cv" class="sheet"><div class="flex sp"><b>Conversation avec ${esc(CF.nom||"Agri")}</b><button class="ic" onclick="chatShow(false)" aria-label="Fermer">✕</button></div><div id="chat" class="chat sh-b"></div><div class="seg">${["Bilan du mois","Vérifie la cohérence de mes données","Comment rendre ma ferme plus rentable ?"].map(t=>`<button onclick="send(this.textContent)">${t}</button>`).join("")}</div><div class="flex"><input id="ci" placeholder="Parlez ou écrivez…" autocomplete="off" onkeydown="if(event.key=='Enter')sendIn()"><button class="mc" id="mc" onclick="mic()" aria-label="Micro">${ICM}</button><button class="mc go" onclick="sendIn()" aria-label="Envoyer">${ICS}</button></div></div>
<div id="cfg" class="sheet tall"><div class="flex sp"><b>Réglages</b><button class="ic" onclick="cfgShow(0)" aria-label="Fermer">✕</button></div><div class="sh-b"><h2>Mon agent</h2>${fl("Nom de l'agent",`<input id="gn" value="${esc(CF.nom||"Agri")}">`)}${fl("Sa mission et vos consignes",`<textarea id="gr" placeholder="ex. : Appelle-moi Chef. Sois direct. Surveille surtout les coûts d'engrais et les prix de vente.">${esc(CF.role||"")}</textarea>`)}${fl("Vitesse de la voix",`<select id="gs">${[["Normale",1],["Rapide",1.25],["Très rapide",1.5]].map(([t,x])=>`<option value="${x}"${x==CF.vit?" selected":""}>${t}</option>`).join("")}</select>`)}${fl("Voix (essayez-en plusieurs)",`<select id="gvx">${voiceOpts()}</select>`)}${fl("Hauteur de la voix",`<select id="gh2">${[["Grave",.85],["Normale",1],["Aiguë, plus féminine",1.2]].map(([t,x])=>`<option value="${x}"${x==(CF.haut||1)?" selected":""}>${t}</option>`).join("")}</select>`)}<button class="btn alt" onclick="testVoix()">▶ Tester la voix</button><label class="flex"><input type="checkbox" id="gv" ${CF.voix?"checked":""} style="width:22px;min-height:22px"> Lire les réponses à voix haute</label><label class="flex"><input type="checkbox" id="gh" ${CF.mains?"checked":""} style="width:22px;min-height:22px"> Mains libres (le micro se rouvre après la réponse)</label><h2>Connexion à l'IA</h2>${fl("Fournisseur principal",`<select id="gp">${["Groq","Gemini"].map(k=>`<option${k==CF.prov?" selected":""}>${k}</option>`).join("")}</select>`)}${fl("Clé Groq",`<input id="gkg" type="password" autocomplete="off" value="${esc(CF.keys.Groq)}">`)}${fl("Clé Gemini",`<input id="gkm" type="password" autocomplete="off" value="${esc(CF.keys.Gemini)}">`)}<span class="mute">Avec les deux clés, si le principal est saturé ou en panne, l'agent bascule tout seul sur l'autre.</span>${fl("Modèle Groq",`<input id="gmg" value="${esc(CF.models.Groq||PROV.Groq[1])}">`)}${fl("Modèle Gemini",`<input id="gmm" value="${esc(CF.models.Gemini||PROV.Gemini[1])}">`)}<button class="btn" onclick="cfgSave()">Enregistrer</button><button class="btn alt" onclick="clrChat()">Effacer la conversation</button><span class="mute">Clé gratuite : aistudio.google.com (Gemini) ou console.groq.com (Groq). Elle reste sur ce téléphone.</span></div></div></div>`;
R.agent=()=>{paint();ui();if(!hasKey())cfgShow(1)};
go("agent");
</script></body></html>
